  <script>
  (function () {
    const themeToggleButton = document.getElementById("theme-toggle");

    function getSavedTheme() {
      try {
        const savedTheme = localStorage.getItem("theme");
        return savedTheme === "light" || savedTheme === "dark" ? savedTheme : null;
      } catch (storageError) {
        return null;
      }
    }

    function saveTheme(theme) {
      try {
        localStorage.setItem("theme", theme);
      } catch (storageError) {
        // Keep the current-session override even when persistence is blocked.
      }
    }

    function determineEffectiveTheme() {
      const explicitlySavedTheme = document.documentElement.getAttribute("data-theme");
      if (explicitlySavedTheme) return explicitlySavedTheme;
      return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }

    let themeFadeTimeout;
    function beginThemeFade() {
      document.documentElement.classList.add("theme-changing");
      clearTimeout(themeFadeTimeout);
      const duration = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--motion-theme")) * 1000;
      themeFadeTimeout = setTimeout(function () {
        document.documentElement.classList.remove("theme-changing");
      }, duration);
    }

    function updateThemeToggleLabel() {
      const currentThemeIsDark = determineEffectiveTheme() === "dark";
      themeToggleButton.textContent = currentThemeIsDark ? "\u263C" : "\u263E";
      const nextTheme = currentThemeIsDark ? "light" : "dark";
      themeToggleButton.setAttribute("aria-label", "Switch to " + nextTheme + " theme");
      themeToggleButton.title = "Switch to " + nextTheme + " theme";
    }

    // Pin the effective palette before media-query CSS can change it, so an OS
    // change starts the same coordinated fade as a manual change.
    let followsSystemTheme = !getSavedTheme();
    document.documentElement.setAttribute("data-theme", determineEffectiveTheme());
    themeToggleButton.hidden = false;
    updateThemeToggleLabel();
    themeToggleButton.addEventListener("click", function () {
      const nextTheme = determineEffectiveTheme() === "dark" ? "light" : "dark";
      followsSystemTheme = false;
      beginThemeFade();
      document.documentElement.setAttribute("data-theme", nextTheme);
      saveTheme(nextTheme);
      updateThemeToggleLabel();
    });
    if (window.matchMedia) {
      window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function (event) {
        if (followsSystemTheme) {
          beginThemeFade();
          document.documentElement.setAttribute("data-theme", event.matches ? "dark" : "light");
          updateThemeToggleLabel();
        }
      });
    }

  })();
  </script>
